<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Speaking Tutor AI</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* GLOBAL */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; }
        :root { --bg: linear-gradient(135deg, #0f0c29 0%, #302b63 100%); --glass: rgba(255, 255, 255, 0.08); --primary: #6c5ce7; --text: #fff; }
        body { background: var(--bg); color: var(--text); font-family: 'Poppins', sans-serif; margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* LAYOUT */
        #app { flex-grow: 1; overflow-y: auto; padding: 20px; padding-bottom: 140px; }
        .hidden { display: none !important; }
        .glass-card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 15px; margin-bottom: 15px; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 12px; width: 100%; border-radius: 12px; font-weight: 600; margin-top: 10px; }
        
        /* CHAT BOX */
        .chat-container { height: 60vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 10px; }
        .bubble { padding: 10px 15px; border-radius: 15px; max-width: 80%; font-size: 14px; line-height: 1.4; }
        .ai { background: rgba(255,255,255,0.1); align-self: flex-start; border-bottom-left-radius: 2px; }
        .user { background: var(--primary); align-self: flex-end; border-bottom-right-radius: 2px; }

        /* CONTROLS (MIC + INPUT) */
        .controls-area {
            position: fixed; bottom: 70px; left: 0; width: 100%;
            background: rgba(15, 12, 41, 0.95); padding: 10px;
            display: flex; align-items: center; gap: 10px; z-index: 100;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .text-input {
            flex-grow: 1; padding: 12px; border-radius: 20px; border: none;
            background: rgba(255,255,255,0.1); color: white; font-size: 14px;
        }
        .mic-btn {
            width: 50px; height: 50px; border-radius: 50%; border: none;
            background: linear-gradient(135deg, #00b894, #00cec9); color: white; font-size: 20px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(0, 184, 148, 0.4); transition: 0.3s;
        }
        .mic-btn.listening { background: #ff7675; animation: pulse 1.5s infinite; }
        
        /* DEBUG CONSOLE (Telefonda xatoni ko'rish uchun) */
        #debug-console {
            position: fixed; top: 0; left: 0; width: 100%; background: rgba(0,0,0,0.8);
            color: #ff7675; font-size: 10px; padding: 5px; z-index: 9999; display: none;
        }

        /* NAV */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #0f0c29; padding: 15px 0; display: flex; justify-content: space-around; border-top: 1px solid rgba(255,255,255,0.1); z-index: 1000; }
        .nav-item { color: #636e72; font-size: 24px; }
        .nav-item.active { color: var(--primary); }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 118, 117, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(255, 118, 117, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 118, 117, 0); } }
    </style>
</head>
<body>

    <div id="debug-console">Debug Log:</div>

    <div id="app">
        <section id="ai-page" class="page">
            <div style="text-align:center; margin-bottom:10px;">
                <h2>AI Examiner 🤖</h2>
                <p style="font-size:11px; opacity:0.6;">Powered by Groq Llama 3</p>
            </div>
            
            <div id="chat-box" class="chat-container">
                <div class="bubble ai">Hello! I am your IELTS Examiner. What is your full name?</div>
            </div>
        </section>

        </div>

    <div class="controls-area">
        <input type="text" id="msg-input" class="text-input" placeholder="Type here..." onkeypress="handleEnter(event)">
        <button class="mic-btn" style="background:#6c5ce7;" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        <button id="mic-btn" class="mic-btn" ontouchstart="toggleMic()" onclick="toggleMic()">
            <i class="fas fa-microphone"></i>
        </button>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active"><i class="fas fa-robot"></i></div>
        <div class="nav-item"><i class="fas fa-home"></i></div>
    </nav>

    <script>
        // --- 1. SOZLAMALAR ---
        const GROQ_API_KEY = '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'; // Kalitingiz
        const user = window.Telegram?.WebApp?.initDataUnsafe?.user || { first_name: "Guest" };
        window.Telegram?.WebApp?.expand();

        // --- 2. LOGGING (Telefonda xatoni ko'rish uchun) ---
        function log(msg) {
            console.log(msg);
            const dbg = document.getElementById('debug-console');
            dbg.style.display = 'block';
            dbg.innerText = "LOG: " + msg;
            setTimeout(() => { dbg.style.display = 'none'; }, 5000);
        }

        function addChat(text, sender) {
            const box = document.getElementById('chat-box');
            box.innerHTML += `<div class="bubble ${sender}">${text}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        // --- 3. AUDIO (MIC) LOGIC ---
        let recognition;
        let isRecording = false;

        // Brauzer turini tekshirish
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.continuous = false; // Telefonda false bo'lgani yaxshi
            recognition.interimResults = false;

            recognition.onstart = () => {
                isRecording = true;
                document.getElementById('mic-btn').classList.add('listening');
                log("Mic started listening...");
            };

            recognition.onend = () => {
                isRecording = false;
                document.getElementById('mic-btn').classList.remove('listening');
                log("Mic stopped.");
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                log("Heard: " + transcript);
                addChat(transcript, 'user');
                askAI(transcript);
            };

            recognition.onerror = (event) => {
                let err = event.error;
                log("Mic Error: " + err);
                if(err === 'not-allowed') alert("Iltimos, Brauzer sozlamalaridan Mikrofonga ruxsat bering!");
                if(err === 'no-speech') alert("Hech narsa eshitilmadi. Qattiqroq gapiring.");
            };
        } else {
            alert("⚠️ Diqqat: Sizning telefoningizda ovozli yozish ishlamaydi (iPhone yoki eski Android). Iltimos, yozma chatdan foydalaning.");
        }

        function toggleMic() {
            if (!recognition) { 
                alert("Kechirasiz, bu telefonda mikrofon ishlamaydi. Iltimos, yozib gaplashing."); 
                return; 
            }
            if (isRecording) recognition.stop();
            else {
                try {
                    recognition.start();
                } catch(e) {
                    log("Start Error: " + e.message);
                }
            }
        }

        // --- 4. TEXT INPUT LOGIC ---
        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (text) {
                addChat(text, 'user');
                askAI(text);
                input.value = "";
            }
        }

        // --- 5. AI BRAIN (GROQ) ---
        async function askAI(text) {
            log("Sending to AI...");
            try {
                const res = await axios.post('https://api.groq.com/openai/v1/chat/completions', {
                    model: "llama-3.3-70b-versatile",
                    messages: [
                        { role: "system", content: "You are an IELTS Examiner. Keep answers short (max 2 sentences). Ask one follow-up question." },
                        { role: "user", content: text }
                    ]
                }, { headers: { 'Authorization': `Bearer ${GROQ_API_KEY}` } });

                const aiResponse = res.data.choices[0].message.content;
                addChat(aiResponse, 'ai');
                speak(aiResponse); // Javobni o'qib berish

            } catch (error) {
                log("AI Error: " + error.message);
                addChat("Error: " + error.message, 'ai');
            }
        }

        // --- 6. TEXT TO SPEECH (JAVOBNI O'QISH) ---
        function speak(text) {
            if ('speechSynthesis' in window) {
                // Telefonda ovoz chiqishi uchun avvalgi ovozlarni to'xtatamiz
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'en-US';
                u.rate = 1;
                window.speechSynthesis.speak(u);
            }
        }
    </script>
</body>
</html>
